<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta name="theme-color" content="#ede4d0">
<link rel="canonical" href="{{CANONICAL_URL}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/bhandar.css">
</head>
<body>

<main>
  <div class="watermark-layer" aria-hidden="true">
    <span class="watermark wm-1">{{WATERMARK_1}}</span>
    <span class="watermark wm-2">{{WATERMARK_2}}</span>
  </div>

  <nav class="crumbs">
    <a href="/">The Bhandar</a>
    <span class="sep">◆</span>
    <span>{{KICKER}}</span>
  </nav>

  <!-- PRIVATE pages only: uncomment the lock band below on Antaranga.
  <div style="text-align:center"><div class="lock-band"><span class="glyph">●</span> Tailnet only · Antaranga</div></div>
  -->

  <header class="page-header">
    <div class="kicker">{{KICKER}}</div>
    <h1>{{H1_HTML}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>
    <div class="meta-bar">{{META_BAR_HTML}}</div>
  </header>

  <!--
    AUTHORING RULES (enforced by publish.py — it will refuse the page):
    - Zero JavaScript. No script elements, ever; the CSP blocks them anyway.
    - The meta description above is REQUIRED and must match the
      "description" field in the manifest metadata.
    - At most ONE <div class="callout"> per page — the single most
      consequential takeaway. Grouped facts go in .note-card / .spec-card.
    - Wrap EVERY table: <div class="table-scroll"><table>…</table></div>
    - Assets live under /<slug>/assets/ (series) or /assets/ (shared);
      downloads under /downloads/<slug>/ with versioned filenames.
  -->
  <article>
{{BODY}}
  </article>

  <footer class="colophon">
    <div class="ornament">◆ &nbsp; ◆ &nbsp; ◆</div>
    <div class="ref">A volume in <a href="/">Brahma's Bhandar</a> &middot; {{DATE}}</div>
  </footer>
</main>

</body>
</html>
